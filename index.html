<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Glowmaze</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- markup:start -->
    <main class="stage" id="stage">
      <canvas id="screen" role="img" aria-label="Glowmaze game screen"></canvas>
    </main>
    <footer class="bar">
      <p class="keys">Arrows or WASD to move · swipe on phones · Enter or tap to start</p>
      <div class="buttons">
        <button id="btn-pause" type="button">Pause</button>
        <button id="btn-sound" type="button" aria-pressed="true">Sound on</button>
      </div>
    </footer>
    <!-- markup:end -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
